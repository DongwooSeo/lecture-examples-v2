# 재사용 워크플로 — 서비스마다 똑같던 "테스트 → jar → 이미지" 단계를 한 곳에 모았다.
# 각 서비스 워크플로는 이 파일을 module 이름만 바꿔 호출한다.
name: service-ci

on:
  workflow_call:
    inputs:
      module:
        description: "Gradle 모듈 이름 (예: order-service)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew :${{ inputs.module }}:test

      - name: Build jar
        run: ./gradlew :${{ inputs.module }}:bootJar

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        if: github.event_name != 'pull_request'
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ inputs.module }}" >> "$GITHUB_ENV"

      - name: Build & push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./${{ inputs.module }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
