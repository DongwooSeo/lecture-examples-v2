# order-service CI/CD — push 한 번으로 테스트 → jar → 이미지 → 레지스트리(GHCR)
#
# 언제 도나: main 에 push 될 때, order-service 또는 공통 모듈(common)이 바뀐 경우에만.
# 결과물:   ghcr.io/<owner>/order-service:<커밋 SHA>  (+ latest)
name: order-service

on:
  push:
    branches: [main]
    paths:
      - "order-service/**"
      - "common/**"
      - "build.gradle"
      - "settings.gradle"
      - ".github/workflows/order-service.yml"
  pull_request:
    paths:
      - "order-service/**"
      - "common/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # GHCR 에 이미지 push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Gradle 캐시 + 래퍼 검증
      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew :order-service:test

      - name: Build jar
        run: ./gradlew :order-service:bootJar

      # PR 에서는 테스트까지만. 이미지는 main 에 들어온 코드만 만든다.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR 이미지 이름은 소문자만 허용된다 (DongwooSeo → dongwooseo)
      - name: Image name
        if: github.event_name != 'pull_request'
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/order-service" >> "$GITHUB_ENV"

      - name: Build & push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./order-service
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
