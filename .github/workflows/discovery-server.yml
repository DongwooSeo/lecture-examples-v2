name: discovery-server

on:
  push:
    branches: [main]
    paths:
      - "discovery-server/**"
      - "common/**"
      - "build.gradle"
      - "settings.gradle"
      - ".github/workflows/discovery-server.yml"
      - ".github/workflows/_service-ci.yml"
  pull_request:
    paths:
      - "discovery-server/**"
      - "common/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/_service-ci.yml
    with:
      module: discovery-server
    secrets: inherit
