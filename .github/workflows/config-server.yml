name: config-server

on:
  push:
    branches: [main]
    paths:
      - "config-server/**"
      - "common/**"
      - "build.gradle"
      - "settings.gradle"
      - ".github/workflows/config-server.yml"
      - ".github/workflows/_service-ci.yml"
  pull_request:
    paths:
      - "config-server/**"
      - "common/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/_service-ci.yml
    with:
      module: config-server
    secrets: inherit
