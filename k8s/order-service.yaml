# order-service 쿠버네티스 매니페스트 — "4형제"를 한 파일에서 읽어 보기
#
#   kubectl apply -f k8s/order-service.yaml
#   kubectl get pods,svc,ingress
#
# 읽는 법: kind(무엇을) + spec(어떤 상태를 원하는지)만 보면 된다.
# 전제: 로컬 클러스터에 order-service:local 이미지가 올라가 있고(kind load / minikube image load),
#       config-server · discovery-server 도 같은 네임스페이스에 Service 이름 그대로 떠 있다.
---
# ① ConfigMap — 설정을 이미지 밖에서 주입한다 (이미지는 그대로, 설정만 바꿔 배포)
apiVersion: v1
kind: ConfigMap
metadata:
  name: order-service-config
data:
  SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
  SPRING_APPLICATION_JSON: '{"eureka":{"client":{"service-url":{"defaultZone":"http://discovery-server:8761/eureka"}},"instance":{"prefer-ip-address":true}}}'
---
# ② Deployment — "order-service Pod 를 항상 2개 유지해 줘" (선언형 · 자가 치유 · 롤링 업데이트)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: order-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: order-service-config
          # 트래픽을 받아도 되는가? — 포트가 열릴 때까지는 Service 가 이 Pod 로 요청을 보내지 않는다
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
          # 살아 있는가? — 응답이 없으면 쿠버네티스가 컨테이너를 재시작한다 (자가 치유)
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
          resources:
            requests:
              memory: "384Mi"
              cpu: "250m"
            limits:
              memory: "768Mi"
---
# ③ Service — Pod 는 소모품(IP 가 바뀐다). 고정된 이름·주소 + 로드밸런싱을 준다
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  selector:
    app: order-service
  ports:
    - port: 8080
      targetPort: 8080
---
# ④ Ingress — 클러스터의 정문. /orders 로 들어온 외부 요청을 order-service 로 보낸다
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: order-service
spec:
  rules:
    - http:
        paths:
          - path: /orders
            pathType: Prefix
            backend:
              service:
                name: order-service
                port:
                  number: 8080
